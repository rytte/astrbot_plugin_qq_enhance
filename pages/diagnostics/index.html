<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QQ 能力增强状态与诊断</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">QQ ENHANCE</p>
          <h1>状态与诊断</h1>
          <p class="subtitle">只读查看 NapCat、能力配置和安全审计状态。</p>
        </div>
        <button id="refresh-button" type="button">刷新</button>
      </header>

      <div id="notice" class="notice" role="status" hidden></div>

      <section aria-labelledby="overview-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">OVERVIEW</p>
            <h2 id="overview-title">运行概览</h2>
          </div>
          <p id="updated-at" class="muted">尚未加载</p>
        </div>
        <div id="summary-cards" class="summary-grid"></div>
      </section>

      <section aria-labelledby="platform-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">PLATFORM</p>
            <h2 id="platform-title">NapCat 平台</h2>
          </div>
          <p id="contract-range" class="muted"></p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>平台实例</th>
                <th>连接</th>
                <th>实现与版本</th>
                <th>账号</th>
                <th>兼容性</th>
                <th>诊断</th>
              </tr>
            </thead>
            <tbody id="platform-rows"></tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="config-title">
        <div class="section-heading">
          <div>
            <p class="section-kicker">CONFIGURATION</p>
            <h2 id="config-title">有效配置摘要</h2>
          </div>
          <span class="badge success">已通过启动校验</span>
        </div>
        <dl id="config-grid" class="config-grid"></dl>
      </section>

      <section aria-labelledby="capability-title">
        <div class="section-heading capability-heading">
          <div>
            <p class="section-kicker">CAPABILITIES</p>
            <h2 id="capability-title">插件操作能力</h2>
          </div>
          <div class="filters">
            <label>
              <span>搜索</span>
              <input id="capability-search" type="search" placeholder="功能、操作或 Action" />
            </label>
            <label>
              <span>分类</span>
              <select id="category-filter"><option value="">全部分类</option></select>
            </label>
            <label>
              <span>状态</span>
              <select id="status-filter">
                <option value="">全部状态</option>
                <option value="enabled">已启用</option>
                <option value="disabled">已禁用</option>
              </select>
            </label>
          </div>
        </div>
        <div class="table-wrap capability-table">
          <table>
            <thead>
              <tr>
                <th>分类</th>
                <th>插件操作</th>
                <th>功能</th>
                <th>NapCat Action</th>
                <th>风险</th>
                <th>权限</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="capability-rows"></tbody>
          </table>
        </div>
        <p id="capability-count" class="table-caption"></p>
      </section>

      <div class="two-column">
        <section aria-labelledby="pending-title">
          <div class="section-heading">
            <div>
              <p class="section-kicker">CONFIRMATIONS</p>
              <h2 id="pending-title">待确认操作</h2>
            </div>
          </div>
          <div id="pending-list" class="record-list"></div>
        </section>

        <section aria-labelledby="audit-title">
          <div class="section-heading">
            <div>
              <p class="section-kicker">AUDIT</p>
              <h2 id="audit-title">最近审计</h2>
            </div>
          </div>
          <div id="audit-list" class="record-list"></div>
        </section>
      </div>

      <footer>此页面只执行只读状态查询，不提供任意 OneBot 调用或账号管理入口。</footer>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
